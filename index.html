<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d5f8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turbi">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css?v=2026-09-26.14">
  <title>Turbi</title>
</head>
<body>
  <aside id="update-notice" class="update-notice" hidden>
    <span>Hay una versión nueva de Turbi.</span>
    <button type="button" id="update-app">Actualizar</button>
  </aside>
  <main>
    <section id="query-view">
      <form id="query-form" class="panel" autocomplete="off" novalidate>
        <h1 class="brand"><img src="img/turbi-logo.png" alt="Turbi" width="900" height="341"></h1>
        <label class="field" id="number-field">
          <span>Nº de vuelo</span>
          <input id="f-number" autocapitalize="characters" spellcheck="false" placeholder="VY3902">
        </label>
        <div id="manual" hidden>
          <label class="field"><span>Origen</span>
            <input id="f-origin" list="airports-list" autocapitalize="characters" spellcheck="false" placeholder="PMI"></label>
          <label class="field"><span>Destino</span>
            <input id="f-destination" list="airports-list" autocapitalize="characters" spellcheck="false" placeholder="BCN"></label>
        </div>
        <div class="row">
          <label class="field"><span>Fecha</span><input id="f-date" type="date"></label>
          <label class="field" id="time-field" hidden><span>Salida (hora local)</span><input id="f-time" type="time"></label>
        </div>
        <p id="notice" class="notice" hidden></p>
        <button type="submit" class="primary">Buscar</button>
        <button type="button" id="toggle-manual" class="link">Introducir a mano</button>
        <button type="button" id="saved-link" class="link" hidden></button>
      </form>
      <datalist id="airports-list"></datalist>
    </section>

    <section id="result-view" hidden>
      <div class="result-bar">
        <button type="button" id="back" class="link on-sky">‹ Nueva consulta</button>
        <button type="button" id="refresh" class="link on-sky" aria-label="Actualizar">Actualizar <span aria-hidden="true">↻</span></button>
      </div>
      <div id="result" class="panel"></div>
      <div class="actions">
        <button type="button" id="change-time" class="secondary">Cambiar hora</button>
      </div>
    </section>

    <div id="loading" class="panel" hidden><div class="spinner"></div><p>Consultando el pronóstico…</p></div>
    <div id="error" class="error" hidden>
      <p id="error-msg"></p>
      <button type="button" id="retry" class="link">Reintentar</button>
    </div>
  </main>
  <script type="module" src="js/app.js?v=2026-09-26.14"></script>
</body>
</html>
