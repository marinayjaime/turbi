# Servicio «turbi-live» en Render (plan gratuito). Ver server/live.mjs.
services:
  - type: web
    name: turbi-live
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node --max-old-space-size=256 --max-semi-space-size=8 server/live.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secretos: solo en el panel de Render (sync: false → nunca en el repositorio).
      - key: AERODATABOX_API_KEY   # RapidAPI, plan gratuito de AeroDataBox
        sync: false
      - key: GITHUB_CACHE_TOKEN    # token de grano fino: solo «Contents: read and write» de este repositorio (caché adb/ en la rama data)
        sync: false
