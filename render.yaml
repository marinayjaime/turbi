# Servicio «turbi-live» en Render (plan gratuito). Ver server/live.mjs.
services:
  - type: web
    name: turbi-live
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server/live.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GITHUB_TOKEN
        sync: false # token de GitHub con permiso de escritura solo en marinayjaime/turbi
