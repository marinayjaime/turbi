# Servicio «turbi-live» en Render (plan gratuito). Ver server/live.mjs.
services:
  - type: web
    name: turbi-live
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node --max-old-space-size=256 --max-semi-space-size=8 server/live.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
