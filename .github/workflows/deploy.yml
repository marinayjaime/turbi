# Publica Turbi en GitHub Pages con los horarios de Aena.
# Cada hora: horarios de hoy y mañana (retrasos, puertas, estados).
# Cada 6 horas, en cada push y a mano: los 14 días completos.
name: Horarios y despliegue

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full, live o auto'
        default: 'full'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar horarios de Aena y montar la web
        run: node scripts/build-flights.mjs
        env:
          MODE: ${{ inputs.mode || 'auto' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
