# Publica Turbi en GitHub Pages con los horarios de Aena.
# Cada 15 min: horarios de hoy y mañana (retrasos, puertas, estados).
# (GitHub no garantiza la hora exacta de las ejecuciones programadas: pueden retrasarse.)
# Cada 6 horas, en cada push y a mano: los 14 días completos.
name: Horarios y despliegue

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full, live o auto'
        default: 'full'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo este trabajo: guardar el histórico de puntualidad en la rama «data»
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Si algún test falla, no se publica nada.
      - name: Tests
        run: npm ci --no-audit --no-fund && npm test
      # Los pasos del histórico nunca bloquean la publicación (continue-on-error).
      - name: Traer el histórico de puntualidad (rama «data»)
        continue-on-error: true
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          set +e
          git ls-remote --exit-code --heads "$REPO" data > /dev/null
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            git clone --quiet --depth 1 --branch data "$REPO" store
          elif [ "$rc" = "2" ]; then
            # La rama aún no existe (primera ejecución)
            mkdir store && git -C store init --quiet -b data && git -C store remote add origin "$REPO"
          else
            echo "No se pudo consultar la rama data (código $rc): esta vez no se actualiza el histórico"
          fi
      - name: Descargar horarios de Aena y montar la web
        run: node scripts/build-flights.mjs
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          PUNCTUALITY_STORE: store
      - name: Guardar el histórico de puntualidad
        continue-on-error: true
        run: |
          [ -d store/.git ] || { echo "Sin copia del histórico"; exit 0; }
          cd store
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios en el histórico"; exit 0; fi
          git -c user.name="turbi-bot" -c user.email="turbi-bot@users.noreply.github.com" \
            commit --quiet -m "Puntualidad $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
