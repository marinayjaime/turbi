name: Build aircraft photo pack

on:
  push:
    branches:
      - asset-pack-aircraft-20260925

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet requests pillow

      - name: Build aircraft reference pack
        shell: bash
        run: |
          cat > /tmp/build_pack.py <<'PY'
          import csv, io, json, re
          from pathlib import Path
          import requests
          from PIL import Image, ImageOps

          ROOT = Path("aviones_comerciales_internacionales")
          ROOT.mkdir(parents=True, exist_ok=True)

          fleets = {
              "Ryanair": [("Boeing 737-800","B738"), ("Boeing 737 MAX 8-200","B38M")],
              "easyJet": [("Airbus A320","A320"), ("Airbus A320neo","A20N"), ("Airbus A321neo","A21N")],
              "Vueling": [("Airbus A320","A320"), ("Airbus A320neo","A20N"), ("Airbus A321","A321")],
              "Iberia": [("Airbus A320neo","A20N"), ("Airbus A321XLR","A21N"), ("Airbus A330-200","A332"), ("Airbus A330-300","A333"), ("Airbus A350-900","A359")],
              "Air Europa": [("Boeing 737-800","B738"), ("Boeing 787-8","B788"), ("Boeing 787-9","B789")],
              "British Airways": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Airbus A350-1000","A35K"), ("Airbus A380-800","A388"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "Lufthansa": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Airbus A350-900","A359"), ("Boeing 747-8","B748"), ("Boeing 787-9","B789")],
              "Air France": [("Airbus A220-300","BCS3"), ("Airbus A320","A320"), ("Airbus A350-900","A359"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "KLM": [("Boeing 737-800","B738"), ("Airbus A321neo","A21N"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789"), ("Boeing 787-10","B78X")],
              "TAP Air Portugal": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Airbus A330-900neo","A339")],
              "SWISS": [("Airbus A220-300","BCS3"), ("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Airbus A330-300","A333"), ("Boeing 777-300ER","B77W")],
              "SAS": [("Airbus A320neo","A20N"), ("Airbus A321LR","A21N"), ("Airbus A330-300","A333"), ("Airbus A350-900","A359")],
              "Norwegian": [("Boeing 737-800","B738"), ("Boeing 737 MAX 8","B38M")],
              "Wizz Air": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N")],
              "ITA Airways": [("Airbus A220-300","BCS3"), ("Airbus A320neo","A20N"), ("Airbus A330-900neo","A339"), ("Airbus A350-900","A359")],
              "Turkish Airlines": [("Airbus A321neo","A21N"), ("Airbus A350-900","A359"), ("Boeing 737 MAX 8","B38M"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "Emirates": [("Airbus A350-900","A359"), ("Airbus A380-800","A388"), ("Boeing 777-300ER","B77W")],
              "Qatar Airways": [("Airbus A350-900","A359"), ("Airbus A350-1000","A35K"), ("Airbus A380-800","A388"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "Etihad Airways": [("Airbus A350-1000","A35K"), ("Airbus A380-800","A388"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789"), ("Boeing 787-10","B78X")],
              "American Airlines": [("Airbus A321","A321"), ("Boeing 737-800","B738"), ("Boeing 737 MAX 8","B38M"), ("Boeing 777-300ER","B77W"), ("Boeing 787-8","B788"), ("Boeing 787-9","B789")],
              "Delta Air Lines": [("Airbus A220-300","BCS3"), ("Airbus A321neo","A21N"), ("Airbus A330-900neo","A339"), ("Airbus A350-900","A359"), ("Boeing 737-900ER","B739")],
              "United Airlines": [("Airbus A321neo","A21N"), ("Boeing 737-800","B738"), ("Boeing 737 MAX 9","B39M"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789"), ("Boeing 787-10","B78X")],
              "Southwest Airlines": [("Boeing 737-800","B738"), ("Boeing 737 MAX 8","B38M")],
              "Air Canada": [("Airbus A220-300","BCS3"), ("Boeing 737 MAX 8","B38M"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "LATAM Airlines": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "Aeromexico": [("Boeing 737-800","B738"), ("Boeing 737 MAX 8","B38M"), ("Boeing 737 MAX 9","B39M"), ("Boeing 787-9","B789")],
              "Singapore Airlines": [("Airbus A350-900","A359"), ("Airbus A380-800","A388"), ("Boeing 737 MAX 8","B38M"), ("Boeing 777-300ER","B77W"), ("Boeing 787-10","B78X")],
              "Cathay Pacific": [("Airbus A321neo","A21N"), ("Airbus A330-300","A333"), ("Airbus A350-900","A359"), ("Airbus A350-1000","A35K"), ("Boeing 777-300ER","B77W")],
              "ANA All Nippon Airways": [("Airbus A321neo","A21N"), ("Airbus A380-800","A388"), ("Boeing 777-300ER","B77W"), ("Boeing 787-8","B788"), ("Boeing 787-9","B789"), ("Boeing 787-10","B78X")],
              "Japan Airlines": [("Airbus A350-900","A359"), ("Airbus A350-1000","A35K"), ("Boeing 737-800","B738"), ("Boeing 787-8","B788"), ("Boeing 787-9","B789")],
              "Qantas": [("Airbus A220-300","BCS3"), ("Airbus A330-200","A332"), ("Airbus A330-300","A333"), ("Airbus A380-800","A388"), ("Boeing 737-800","B738"), ("Boeing 787-9","B789")],
              "Air India": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Airbus A350-900","A359"), ("Boeing 777-300ER","B77W"), ("Boeing 787-8","B788")],
              "Korean Air": [("Airbus A321neo","A21N"), ("Airbus A330-300","A333"), ("Airbus A350-900","A359"), ("Airbus A380-800","A388"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
              "Air New Zealand": [("Airbus A320neo","A20N"), ("Airbus A321neo","A21N"), ("Boeing 777-300ER","B77W"), ("Boeing 787-9","B789")],
          }

          BASE = "https://raw.githubusercontent.com/laegsgaardTroels/whatisflying-db/master/data"
          session = requests.Session()
          session.headers.update({"User-Agent": "Turbi-aircraft-reference-pack/1.0"})

          def safe_name(s):
              return re.sub(r'[<>:"/\\|?*]', "-", s).strip()

          meta_csv = session.get(f"{BASE}/aircraft_types_pictures.csv", timeout=60)
          meta_csv.raise_for_status()
          meta_text = meta_csv.content.decode("utf-8-sig")
          meta = {}
          for row in csv.DictReader(io.StringIO(meta_text)):
              vals = list(row.values())
              code = row.get("aircraft_type") or row.get("icao_code") or (vals[0] if vals else "")
              meta[code] = row

          cache = {}
          source_rows = []
          catalog = []
          failures = []

          all_codes = sorted({code for models in fleets.values() for _, code in models})
          for code in all_codes:
              url = f"{BASE}/aircraft_types_pictures/{code}.webp"
              try:
                  r = session.get(url, timeout=60)
                  r.raise_for_status()
                  img = Image.open(io.BytesIO(r.content))
                  img = ImageOps.exif_transpose(img).convert("RGB")
                  if img.width > 1600:
                      h = round(img.height * 1600 / img.width)
                      img = img.resize((1600, h), Image.Resampling.LANCZOS)
                  buf = io.BytesIO()
                  img.save(buf, "JPEG", quality=90, optimize=True, progressive=True)
                  cache[code] = buf.getvalue()
              except Exception as e:
                  failures.append(f"{code}: {e}")

          for airline, models in fleets.items():
              for model, code in models:
                  if code not in cache:
                      failures.append(f"{airline} | {model} | sin imagen para {code}")
                      continue
                  folder = ROOT / safe_name(airline) / safe_name(model)
                  folder.mkdir(parents=True, exist_ok=True)
                  out = folder / "foto.jpg"
                  out.write_bytes(cache[code])

                  m = meta.get(code, {})
                  vals = list(m.values())
                  source_url = m.get("source_url") or (vals[2] if len(vals) > 2 else "")
                  author = m.get("author") or (vals[3] if len(vals) > 3 else "")
                  author_url = m.get("author_url") or (vals[4] if len(vals) > 4 else "")
                  license_name = m.get("license") or (vals[5] if len(vals) > 5 else "")
                  source_rows.append({
                      "aerolinea": airline,
                      "modelo": model,
                      "codigo_icao_tipo": code,
                      "archivo": str(out.relative_to(ROOT)),
                      "nota": "Foto representativa del modelo; no garantiza la librea de esta aerolínea.",
                      "autor": author,
                      "autor_url": author_url,
                      "licencia": license_name,
                      "fuente_original": source_url,
                      "repositorio_fuente": "https://github.com/laegsgaardTroels/whatisflying-db",
                  })
                  catalog.append({
                      "airline": airline,
                      "model": model,
                      "icaoType": code,
                      "path": str(out.relative_to(ROOT)),
                      "representativePhoto": True,
                      "airlineLiveryGuaranteed": False,
                      "source": source_url,
                      "author": author,
                      "license": license_name,
                  })

          fields = ["aerolinea","modelo","codigo_icao_tipo","archivo","nota","autor","autor_url","licencia","fuente_original","repositorio_fuente"]
          with open(ROOT / "FUENTES_Y_LICENCIAS.csv", "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(source_rows)

          with open(ROOT / "catalogo.json", "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)

          with open(ROOT / "README.txt", "w", encoding="utf-8") as f:
              f.write(
                  "BIBLIOTECA DE AVIONES COMERCIALES INTERNACIONALES PARA TURBI\n"
                  "==========================================================\n\n"
                  "Estructura: Aerolínea / Modelo / foto.jpg\n\n"
                  "Incluye una selección amplia de grandes aerolíneas internacionales y modelos "
                  "comerciales habituales. No es una lista literal de todas las aerolíneas del mundo.\n\n"
                  "IMPORTANTE: las fotos son representativas del MODELO de avión. Se organizan dentro "
                  "de cada aerolínea según los modelos utilizados por esa compañía, pero la fotografía "
                  "no garantiza que muestre la librea concreta de esa aerolínea.\n\n"
                  "FUENTES_Y_LICENCIAS.csv contiene autor, licencia y fuente original. Respeta la "
                  "atribución y las condiciones de cada licencia antes de republicar las fotografías.\n"
              )

          if failures:
              (ROOT / "NO_ENCONTRADOS.txt").write_text("\n".join(failures) + "\n", encoding="utf-8")

          print("Aerolíneas:", len(fleets))
          print("Fotos:", len(catalog))
          print("Modelos únicos:", len(cache))
          PY

          python /tmp/build_pack.py

      - name: Upload aircraft pack
        uses: actions/upload-artifact@v4
        with:
          name: aviones-comerciales-internacionales
          path: aviones_comerciales_internacionales/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
